name: Temporary Worker Handoff

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted Worker archive
        run: >-
          curl --fail --location --retry 2
          --request POST
          'https://temp.sh/kUJmQ/OneC77.AsyncWorker-resource-lanes-27281a2515eb4f40706bb2ae1259dc02907ee9c6.zip.enc'
          --output OneC77.AsyncWorker-resource-lanes.zip.enc

      - name: Verify encrypted payload
        run: |
          test "$(stat -c%s OneC77.AsyncWorker-resource-lanes.zip.enc)" -gt 1000000
          file OneC77.AsyncWorker-resource-lanes.zip.enc

      - name: Upload encrypted handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-resource-lanes-encrypted-handoff
          path: OneC77.AsyncWorker-resource-lanes.zip.enc
          if-no-files-found: error
          retention-days: 1
