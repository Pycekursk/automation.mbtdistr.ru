name: Temporary Worker Diagnostic Handoff

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed diagnostic Worker archive
        env:
          URL_B64: 
        run: |
          set -euo pipefail
          url="$(printf '%s' "$URL_B64" | base64 -d)"
          curl --fail --location --retry 2 "$url" -o OneC77.AsyncWorker-resource-lanes-DIAG-a3fd97f.zip
          test "$(stat -c%s OneC77.AsyncWorker-resource-lanes-DIAG-a3fd97f.zip)" -gt 1000000
          unzip -t OneC77.AsyncWorker-resource-lanes-DIAG-a3fd97f.zip >/dev/null

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-resource-lanes-diag-handoff
          path: OneC77.AsyncWorker-resource-lanes-DIAG-a3fd97f.zip
          if-no-files-found: error
          retention-days: 1
